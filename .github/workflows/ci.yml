name: Release Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend tests
      - run: python -m pytest
      - run: python -m pip_audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: npm run lint
      - run: npm run format
      - run: npm run test:unit
      - run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner_test -d planner_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests/test_ai.py::test_postgres_planning_smoke
        env:
          PLANNER_TEST_POSTGRES_URL: postgresql://planner_test:test_only_password@127.0.0.1:5432/planner_test?sslmode=disable

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t planner:test .
      - run: docker run -d --name planner -p 127.0.0.1:3000:3000 planner:test
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to become healthy:"
          docker ps -a
          docker logs planner
          exit 1
      - run: docker exec planner sh -c 'test ! -e /app/tests && test ! -e /app/backend/.env && test ! -e /app/node_modules && test "$(id -u)" = 10001'
      - run: docker logs planner
        if: failure()
      - run: docker rm -f planner
        if: always()