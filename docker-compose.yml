services:
  postgres:
    image: postgres:16-alpine
    container_name: event-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner_secret}
      POSTGRES_DB: ${POSTGRES_DB:-event_planner}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-event_planner}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
